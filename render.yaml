# Render Blueprint: https://render.com/docs/blueprint-spec
# Deploys the API in server/ plus a Postgres database. In Render: New -> Blueprint -> pick this repo.
services:
  - type: web
    name: surakshax-api
    runtime: python
    rootDir: server
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips="*"
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DATABASE_URL
        fromDatabase:
          name: surakshax-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_USERNAME
        value: admin
      # Asked for when the Blueprint is created
      - key: ADMIN_PASSWORD
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: OSM_USER_AGENT
        sync: false
      # Optional: SMS + voice call from the server
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_PHONE_NUMBER
        sync: false

databases:
  - name: surakshax-db
    plan: free
    databaseName: surakshax
    user: surakshax
